name: build

on:
  push:
    branches: [main, "wip/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  client:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            exe: buscraft
          - os: macos-latest
            name: macos-arm64
            exe: buscraft
          - os: windows-latest
            name: windows-x86_64
            exe: buscraft.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries (Bluetooth over D-Bus, serial port discovery over udev)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libdbus-1-dev libudev-dev pkg-config
      - run: cargo build --release --locked || cargo build --release
      - run: cargo test --release
      - name: package
        shell: bash
        run: |
          mkdir -p ../dist
          cp target/release/${{ matrix.exe }} ../dist/
          cd ../dist && 7z a -tzip ../buscraft-${{ matrix.name }}.zip ${{ matrix.exe }} > /dev/null || zip ../buscraft-${{ matrix.name }}.zip ${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: buscraft-${{ matrix.name }}
          path: buscraft-${{ matrix.name }}.zip

  app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npx tauri build --bundles app,dmg
      - name: package
        run: cp src-tauri/target/release/bundle/dmg/*.dmg ../BusCraft-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: buscraft-app-macos
          path: BusCraft-macos.dmg

  firmware-pico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build
      - uses: actions/cache@v4
        with:
          path: pico-sdk
          key: pico-sdk-2.2.0
      - name: Pico SDK
        run: test -d pico-sdk/src || (git clone -q --depth 1 --branch 2.2.0 https://github.com/raspberrypi/pico-sdk.git && git -C pico-sdk submodule update -q --init --depth 1)
      - run: cmake -S fw-pico -B fw-pico/build -G Ninja -DPICO_SDK_PATH=$PWD/pico-sdk -DCMAKE_BUILD_TYPE=Release
      - run: ninja -C fw-pico/build
      - run: cd fw-pico/build && zip -q ../../buscraft-fw-pico.zip buscraft-pico.uf2 buscraft-pico.elf
      - uses: actions/upload-artifact@v4
        with:
          name: buscraft-fw-pico
          path: buscraft-fw-pico.zip

  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: project
        run: echo "pro=$(ls hw/*.kicad_pro 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
      - name: install KiCad
        if: steps.project.outputs.pro != ''
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad-cli
      - name: fabrication outputs
        if: steps.project.outputs.pro != ''
        run: |
          P=${{ steps.project.outputs.pro }}; B=${P%.kicad_pro}
          mkdir -p hw/fab/gerbers
          kicad-cli pcb export gerbers --output hw/fab/gerbers/ "$B.kicad_pcb"
          kicad-cli pcb export drill --output hw/fab/gerbers/ "$B.kicad_pcb"
          kicad-cli pcb export pos --format csv --units mm --side both --output hw/fab/placement.csv "$B.kicad_pcb"
          kicad-cli sch export bom --output hw/fab/bom.csv "$B.kicad_sch"
          kicad-cli sch export pdf --output hw/fab/schematic.pdf "$B.kicad_sch"
          cd hw/fab && zip -qr ../../buscraft-hw.zip .
      - uses: actions/upload-artifact@v4
        if: steps.project.outputs.pro != ''
        with:
          name: buscraft-hw
          path: buscraft-hw.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [client, app, firmware-pico, hardware]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
          draft: true
