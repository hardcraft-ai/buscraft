# Weekly dependency update pull requests; security updates arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/client", "/app/src-tauri"]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
