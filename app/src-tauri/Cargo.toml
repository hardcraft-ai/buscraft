[package]
name = "buscraft-app"
version = "0.1.0"
description = "BusCraft desktop app"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "buscraft_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }
buscraft = { path = "../../client" }
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-blec = "0.20"
tauri-plugin-serialplugin = "4.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
